services:
  postgres:
    image: postgres:16-alpine
    container_name: friendcore-postgres
    environment:
      POSTGRES_USER: friendcore
      POSTGRES_PASSWORD: friendcore
      POSTGRES_DB: friendcore
    ports:
      - "5432:5432"
    volumes:
      - friendcore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friendcore -d friendcore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: friendcore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  friendcore_postgres_data:
