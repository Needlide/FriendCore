services:
  postgres:
    image: postgres:16-alpine
    container_name: friendcore-postgres
    environment:
      POSTGRES_USER: friendcore
      POSTGRES_PASSWORD: friendcore
      POSTGRES_DB: friendcore
    ports:
      - "5432:5432"
    volumes:
      - friendcore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friendcore -d friendcore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: friendcore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: RustFS runs as uid 10001, but Docker creates a fresh named volume owned by
  # root — so a clean machine gets "Io error: Permission denied (os error 13)" and the media
  # service never starts. Chown the volume before RustFS does, or every fresh clone and every
  # new host hits this. Runs as root deliberately; it has no other job.
  minio-init:
    image: alpine:3
    user: root
    command: chown -R 10001:10001 /data
    volumes:
      - friendcore_minio_data:/data
    restart: "no"

  minio:
    image: rustfs/rustfs:1.0.0
    container_name: friendcore-minio
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - friendcore_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  friendcore_postgres_data:
  friendcore_minio_data:
